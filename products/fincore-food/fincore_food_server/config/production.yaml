# ═══════════════════════════════════════════════════════════════════
# FINCORE Food Server — Produção
# Altere api.fincore.com.br pelo domínio real quando disponível
# ═══════════════════════════════════════════════════════════════════

# ─── API Server ─────────────────────────────────────────────────────
apiServer:
  port: 8080
  publicHost: api.fincore.com.br
  publicPort: 443
  publicScheme: https

# ─── Insights Server ────────────────────────────────────────────────
insightsServer:
  port: 8081
  publicHost: insights.fincore.com.br
  publicPort: 443
  publicScheme: https

# ─── Web Server ─────────────────────────────────────────────────────
webServer:
  port: 8082
  publicHost: app.fincore.com.br
  publicPort: 443
  publicScheme: https

# ─── Supabase PostgreSQL (Banco Central de Produção) ────────────────
database:
  host: db.nlaxdeqbordmovukyypk.supabase.co
  port: 5432
  name: postgres
  user: postgres
  requireSsl: true

# ─── Redis (habilitar quando escalar) ───────────────────────────────
redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: false
  persistentEnabled: true
  consoleLogFormat: json

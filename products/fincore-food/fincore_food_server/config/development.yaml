# ═══════════════════════════════════════════════════════════════════
# FINCORE Food Server — Ambiente de Desenvolvimento
# Serverpod conecta no Supabase PostgreSQL como banco de dados central
# ═══════════════════════════════════════════════════════════════════

# ─── API Server ─────────────────────────────────────────────────────
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

# ─── Insights Server ────────────────────────────────────────────────
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# ─── Web Server ─────────────────────────────────────────────────────
webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# ─── Supabase PostgreSQL (Banco Central) ────────────────────────────
# Serverpod conecta diretamente no PostgreSQL gerenciado pelo Supabase
# A senha está em config/passwords.yaml (development.database)
database:
  host: db.nlaxdeqbordmovukyypk.supabase.co
  port: 5432
  name: postgres
  user: postgres
  requireSsl: true
  poolSize: 20

# ─── Redis (desabilitado por ora) ───────────────────────────────────
redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text

# futureCallExecutionEnabled: true

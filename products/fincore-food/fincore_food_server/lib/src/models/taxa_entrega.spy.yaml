class: TaxaEntrega
table: taxa_entrega
fields:
  id: UuidValue, defaultModel=random
  tenantId: String
  nome: String
  tipoRegra: String
  bairro: String?
  cepInicial: String?
  cepFinal: String?
  valorCentavos: int
  ativo: bool
  pedidoMinimoCentavos: int, default=0
  prazoEstimado: String?
  observacoes: String?

  # Auditoria
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue
  updatedBy: UuidValue
  deletedAt: DateTime?
  deletedBy: UuidValue?

  # Sincronização
  syncVersion: int
  originDeviceId: String?
  lastModifiedByDevice: String?
  entityHash: String?

indexes:
  taxa_ent_tenant_idx:
    fields: tenantId

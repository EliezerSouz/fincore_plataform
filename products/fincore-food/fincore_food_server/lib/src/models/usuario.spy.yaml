class: Usuario
table: usuarios
fields:
  id: UuidValue, defaultModel=random
  # activeTenantId: preferência do último contexto ativo — NÃO é FK de acesso.
  # O acesso real a uma empresa é controlado exclusivamente por membro_empresa.
  activeTenantId: UuidValue?
  authUserId: String?
  username: String
  email: String?
  nome: String
  avatarUrl: String?
  ativo: bool
  criadoEm: DateTime
  atualizadoEm: DateTime

indexes:
  usr_username_unique_idx:
    fields: username
    unique: true


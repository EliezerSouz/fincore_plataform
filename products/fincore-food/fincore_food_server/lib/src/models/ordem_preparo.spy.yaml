class: OrdemPreparo
table: ordens_preparo
fields:
  id: UuidValue, defaultModel=random
  tenantId: String
  pedidoId: String
  itensJson: String           # JSON: [{produtoId, nome, quantidade}]
  status: String              # pendente | em_preparo | pronto | entregue | cancelado
  prioridade: String          # normal | urgente | vip | programado
  operadorId: String?
  criadaEm: DateTime
  iniciadaEm: DateTime?
  concluidaEm: DateTime?
  canceladaEm: DateTime?
  tempoEstimadoSegundos: int
  observacoes: String?

  # Auditoria
  createdAt: DateTime
  updatedAt: DateTime
  createdBy: UuidValue
  updatedBy: UuidValue
  deletedAt: DateTime?
  deletedBy: UuidValue?

  # Sincronizacao
  syncVersion: int
  originDeviceId: String?
  lastModifiedByDevice: String?
  entityHash: String?

indexes:
  ordens_preparo_tenant_status_idx:
    fields: tenantId, status
  ordens_preparo_tenant_pedido_idx:
    fields: tenantId, pedidoId

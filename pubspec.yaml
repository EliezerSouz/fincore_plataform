name: salgaderia
description: Sistema desktop de gestão de pedidos para salgaderia.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  esc_pos_utils_plus: ^2.0.4
  uuid: ^4.5.1
  google_fonts: ^6.3.2
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Arquitetura local-first: apenas PostgreSQL local.
  # O Serverpod foi eliminado. O Flutter conversa diretamente com Supabase.
  # Para subir automaticamente com o Windows: habilite "Start on boot" no
  # Docker Desktop → Settings → General → "Start Docker Desktop when you log in"
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fincore_food
      POSTGRES_PASSWORD: "-nijjTTsE4w_s9T_lJUH1WE62wnU4ZO5"
    volumes:
      - fincore_platform_data:/var/lib/postgresql/data

volumes:
  fincore_platform_data:

services:
  # Platform development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fincore_food
      POSTGRES_PASSWORD: "-nijjTTsE4w_s9T_lJUH1WE62wnU4ZO5"
    volumes:
      - fincore_platform_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "x84OnZrNo2kupE55vLdAtJhL0TAeYkYt"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Platform test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fincore_food_test
      POSTGRES_PASSWORD: "inNikD-ZPKeEGdxqwFB7YvO0F8bXknv6"
    volumes:
      - fincore_platform_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "I_hQiP_lG7HfSMWqvKLqN5yg1x_yXT-k"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  fincore_platform_data:
  fincore_platform_test_data:
